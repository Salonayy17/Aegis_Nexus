<!doctype html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="color-scheme" content="dark light"/><meta name="theme-color" content="#0A0A0A"/><title>AEGIS NEXUS</title>
<script>/* Apply the saved theme before first paint to avoid a flash of the wrong theme. Default: dark. */
try{var t=localStorage.getItem('aegis-theme');t=t==='light'?'light':'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#F5F6F8':'#0A0A0A'}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
